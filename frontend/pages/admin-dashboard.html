<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Overview - ChainHire 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 900: "#0F172A", 800: "#1E293B", 700: "#334155" },
            emerald: { 500: "#10B981", 600: "#059669", 700: "#047857", 50: "#ECFDF5" },
            surface: "#F8FAFC"
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-surface text-slate-800 antialiased min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="flex-1 ml-[260px]">
      <!-- Topbar Header -->
      <div id="topbar-container"></div>

      <!-- Main Container -->
      <main class="p-8 max-w-7xl mx-auto">
        <!-- Overview Header (Matching Screenshot 3) -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-slate-900">Overview</h1>
          <p class="text-xs text-slate-500 mt-0.5">Welcome back, Admin. Here's what's happening on ChainHire.</p>
        </div>

        <!-- 4 Platform Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          
          <!-- Card 1: Total Users -->
          <div class="chain-card p-6 flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              </div>
              <div class="text-xs font-semibold text-slate-500">Total Users</div>
              <div id="admin-total-users" class="text-2xl font-black text-slate-900 mt-1">2,845</div>
            </div>
            <div id="admin-total-users-trend" class="flex items-center gap-1 text-xs font-semibold text-emerald-600 mt-3">
              ↑ 12.4% from last month
            </div>
          </div>

          <!-- Card 2: Verified Credentials -->
          <div class="chain-card p-6 flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              </div>
              <div class="text-xs font-semibold text-slate-500">Verified Credentials</div>
              <div id="admin-verified-credentials" class="text-2xl font-black text-slate-900 mt-1">2,153</div>
            </div>
            <div id="admin-verified-credentials-trend" class="flex items-center gap-1 text-xs font-semibold text-emerald-600 mt-3">
              ↑ 8.7% from last month
            </div>
          </div>

          <!-- Card 3: Active Jobs -->
          <div class="chain-card p-6 flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
              <div class="text-xs font-semibold text-slate-500">Active Jobs</div>
              <div id="admin-active-jobs" class="text-2xl font-black text-slate-900 mt-1">612</div>
            </div>
            <div id="admin-active-jobs-trend" class="flex items-center gap-1 text-xs font-semibold text-emerald-600 mt-3">
              ↑ 5.3% from last month
            </div>
          </div>

          <!-- Card 4: Blocked Accounts -->
          <div class="chain-card p-6 flex flex-col justify-between">
            <div>
              <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              </div>
              <div class="text-xs font-semibold text-slate-500">Blocked Accounts</div>
              <div id="admin-blocked-accounts" class="text-2xl font-black text-slate-900 mt-1">37</div>
            </div>
            <div id="admin-blocked-accounts-trend" class="flex items-center gap-1 text-xs font-semibold text-red-600 mt-3">
              ↓ 11.2% from last month
            </div>
          </div>

        </div>

        <!-- Users Table Card (Matching Screenshot 3) -->
        <div id="users-section" class="chain-card">
          <!-- Card Header Controls -->
          <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <h2 class="text-lg font-bold text-slate-900 self-start sm:self-center">Users</h2>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
              <!-- Search Input -->
              <div class="relative flex-1 sm:w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" id="admin-search-users" oninput="Admin.loadUsers()" placeholder="Search users..." 
                  class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 focus:bg-white transition-all" />
              </div>

              <!-- Role Filter -->
              <select id="admin-role-filter" onchange="Admin.loadUsers()" 
                class="px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg text-slate-700 font-medium focus:outline-none focus:border-emerald-500">
                <option value="All Roles">All Roles</option>
                <option value="jobSeeker">Candidates</option>
                <option value="recruiter">Employers / Verifiers</option>
                <option value="admin">Admins</option>
              </select>
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead class="bg-slate-50/70 text-slate-400 text-[11px] uppercase tracking-wider font-semibold border-b border-slate-100">
                <tr>
                  <th class="py-3 px-6">Name</th>
                  <th class="py-3 px-6">Email</th>
                  <th class="py-3 px-6">Role</th>
                  <th class="py-3 px-6">Status</th>
                  <th class="py-3 px-6 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="admin-users-tbody" class="divide-y divide-slate-100">
                <!-- Dynamically populated via admin.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/web3.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Admin.initDashboard();
    });
  </script>
</body>
</html>
