<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - ChainHire 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 900: "#0F172A", 800: "#1E293B", 700: "#334155" },
            emerald: { 500: "#10B981", 600: "#059669", 700: "#047857", 50: "#ECFDF5" },
            surface: "#F8FAFC"
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-surface text-slate-800 antialiased min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="flex-1 ml-[260px]">
      <!-- Topbar Header -->
      <div id="topbar-container"></div>

      <!-- Main Container -->
      <main class="p-8 max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-slate-900">Messages</h1>
          <p class="text-xs text-slate-500 mt-0.5">Communicate directly with verified recruiters, verifiers, and candidates.</p>
        </div>

        <!-- Chat Container Box -->
        <div class="chain-card flex h-[640px] overflow-hidden">
          
          <!-- Left: Contacts Sidebar -->
          <div class="w-80 border-r border-slate-100 flex flex-col bg-white">
            <div class="p-4 border-b border-slate-100">
              <input type="text" id="chat-search-input" oninput="Chat.filterContacts(this.value)" placeholder="Search conversations..." 
                class="w-full px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500" />
            </div>
            
            <div id="chat-contacts-list" class="flex-1 overflow-y-auto">
              <!-- Populated via chat.js -->
            </div>
          </div>

          <!-- Right: Active Chat Window -->
          <div class="flex-1 flex flex-col bg-slate-50/50">
            <!-- Active Header -->
            <div id="chat-active-header" class="p-4 border-b border-slate-200/80 bg-white">
              <div class="text-xs text-slate-400">Select a conversation from the left to start messaging.</div>
            </div>

            <!-- Messages Stream -->
            <div id="chat-messages-stream" class="flex-1 p-6 overflow-y-auto">
              <!-- Populated via chat.js -->
            </div>

            <!-- Input Bar -->
            <div class="p-4 bg-white border-t border-slate-200">
              <form onsubmit="Chat.sendMessage(event)" class="flex items-center gap-3">
                <input type="text" id="chat-input-field" placeholder="Type your message here..." 
                  class="flex-1 px-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white" />
                <button type="submit" class="btn-emerald text-xs py-2.5 px-5 rounded-xl">
                  <span>Send</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
              </form>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- User Profile Quick-View Modal (Stays on Messages page) -->
  <div id="user-profile-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="chain-card max-w-xl w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl relative">
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <h3 id="modal-user-title" class="font-bold text-slate-900 text-base">User Profile</h3>
        </div>
        <button onclick="Chat.closeUserProfileModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg p-1">✕</button>
      </div>

      <!-- Modal Body -->
      <div id="user-profile-modal-body" class="mt-4">
        <div class="py-12 text-center text-slate-400 text-xs">
          <svg class="w-8 h-8 mx-auto mb-2 animate-spin text-emerald-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
          Loading profile details...
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/web3.js"></script>
  <script src="../js/chat.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Chat.init();
    });
  </script>
</body>
</html>
