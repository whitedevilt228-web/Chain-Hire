<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ChainHire 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 900: "#0F172A", 800: "#1E293B", 700: "#334155" },
            emerald: { 500: "#10B981", 600: "#059669", 700: "#047857", 50: "#ECFDF5" },
            surface: "#F8FAFC"
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-surface text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    
    <!-- Logo & Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-navy-900 border border-slate-700 shadow-md mb-3 text-emerald-400">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-navy-900 tracking-tight">Chain<span class="text-emerald-500">Hire</span> 2.0</h1>
      <p class="text-xs text-slate-500 mt-1">Decentralized Career Verification & Web3 Talent Platform</p>
    </div>

    <!-- Login Card -->
    <div class="chain-card p-8 shadow-xl">
      <h2 class="text-lg font-bold text-slate-900 mb-5">Sign In to Your Account</h2>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="login-email" required placeholder="alex.morgan@example.com" 
            class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 focus:bg-white transition-all" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-semibold text-slate-700">Password</label>
            <a href="#" class="text-xs text-emerald-600 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" 
              class="w-full px-3.5 py-2.5 pr-10 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 focus:bg-white transition-all" />
            <button type="button" onclick="togglePasswordVisibility('login-password', 'eye-icon-login')" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none" title="Show/Hide Password">
              <svg id="eye-icon-login" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="w-full btn-emerald py-2.5 rounded-lg text-sm font-semibold mt-2">
          Sign In
        </button>
      </form>

      <!-- Register Link -->
      <div class="mt-6 text-center text-xs text-slate-500 pt-5 border-t border-slate-100">
        Don't have an account yet? 
        <a href="register.html" class="font-semibold text-emerald-600 hover:underline">Create Account</a>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input) return;

      if (input.type === "password") {
        input.type = "text";
        if (icon) {
          icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
          `;
        }
      } else {
        input.type = "password";
        if (icon) {
          icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          `;
        }
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      try {
        const res = await API.post("/auth/login", { email, password });
        if (res.success) {
          Auth.setAuth(res.user, res.token);
          showToast(`Welcome back, ${res.user.fullName}!`, "success");
          setTimeout(() => {
            Auth.redirectByRole(res.user.role);
          }, 600);
        }
      } catch (err) {
        showToast(err.message, "error");
      }
    }
  </script>
</body>
</html>
